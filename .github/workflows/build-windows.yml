name: Build Windows app

# Builds the Windows application and attaches the installer to a release.
#
# Runs when a release is published — which is what merging the Release Please
# pull request does — so there is a single path from commit to downloadable
# installer. The tag trigger was deliberately removed: with Release Please
# creating tags too, two workflows would race to attach the same binary.
#
# Can also be run by hand from the Actions tab, which builds and uploads an
# artifact without touching any release.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Build the tagged commit, not whatever main happens to be. On a release
      # event the default ref can be ahead of the tag, which would ship an
      # installer whose version disagrees with the code inside it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pytest
          # Install the project itself, so qsl_send is a real importable
          # package rather than just a folder in the checkout.
          pip install .

      - name: Run tests
        run: pytest tests/ -q

      - name: Build the application
        run: pyinstaller packaging/qsl-send.spec --noconfirm

      # --- Code signing (inactive until a certificate is configured) ---
      #
      # Unsigned executables are blocked outright by Smart App Control on a
      # clean Windows 11, with "An Application Control Policy has blocked this
      # file" and no way for the user to continue. Signing is the only fix that
      # does not require every colleague to lower their own protection.
      #
      # To enable: add the WINDOWS_CERT_BASE64 and WINDOWS_CERT_PASSWORD
      # repository secrets, then uncomment the three steps below.
      #
      # - name: Decode the signing certificate
      #   run: |
      #     [IO.File]::WriteAllBytes(
      #       "$env:RUNNER_TEMP\cert.pfx",
      #       [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_BASE64 }}"))
      #   shell: pwsh
      #
      # - name: Sign the application
      #   # Signed before Inno Setup packages it: Windows checks the installer
      #   # and the application it installs separately, so both need signing.
      #   run: |
      #     & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
      #       /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
      #       /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
      #       "dist\QSL Sender\QSL Sender.exe"
      #   shell: pwsh

      - name: Build the installer
        run: |
          iscc packaging\installer.iss
        shell: cmd

      # - name: Sign the installer
      #   run: |
      #     & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
      #       /f "$env:RUNNER_TEMP\cert.pfx" /p "${{ secrets.WINDOWS_CERT_PASSWORD }}" `
      #       /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
      #       (Get-ChildItem installer\QSL-Sender-Setup-*.exe).FullName
      #   shell: pwsh

      # Only the installer. dist/ also holds PyInstaller's compiled folder,
      # and shipping both made the download look duplicated: a colleague saw
      # a setup .exe next to a folder containing another .exe.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: QSL-Sender-installer
          path: installer/QSL-Sender-Setup-*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: installer/QSL-Sender-Setup-*.exe
