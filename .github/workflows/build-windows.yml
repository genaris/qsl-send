name: Build Windows app

# Builds the Windows application. Runs on demand, and on a version tag, where
# it also attaches the installer to a GitHub Release for colleagues to download.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller Pillow PyYAML requests pytest

      - name: Run tests
        run: pytest tests/ -q

      - name: Build the application
        run: pyinstaller packaging/qsl-send.spec --noconfirm

      - name: Build the installer
        run: |
          iscc packaging\installer.iss
        shell: cmd

      - name: Upload the built application
        uses: actions/upload-artifact@v4
        with:
          name: QSL-Sender-windows
          path: dist/

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QSL-Sender-Setup-*.exe
