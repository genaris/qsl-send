name: Build Windows app

# Builds the Windows application. Runs on demand, and on a version tag, where
# it also attaches the installer to a GitHub Release for colleagues to download.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pytest
          # Install the project itself, so qsl_send is a real importable
          # package rather than just a folder in the checkout.
          pip install .

      - name: Run tests
        run: pytest tests/ -q

      - name: Build the application
        run: pyinstaller packaging/qsl-send.spec --noconfirm

      - name: Build the installer
        run: |
          iscc packaging\installer.iss
        shell: cmd

      # Only the installer. dist/ also holds PyInstaller's compiled folder,
      # and shipping both made the download look duplicated: a colleague saw
      # a setup .exe next to a folder containing another .exe.
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: QSL-Sender-installer
          path: installer/QSL-Sender-Setup-*.exe
          if-no-files-found: error

      - name: Attach the installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/QSL-Sender-Setup-*.exe
